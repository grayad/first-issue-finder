<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/style.css" />
  <title>First Issue Finder</title>
</head>

<body>
  <header class="d-flex flex-column justify-content-center align-items-center">
    <a href="./index.html">
      <img src="./assets/images/logo.png" class="logo img-fluid" alt="First Issue Finder logo" />
    </a>
  </header>

  <main class="d-flex flex-column align-items-center text-center px-3">
    <a href="./openSource.html" class="text-decoration-none fw-bold mt-3">About Open Source</a>
    <p class="text-center mt-3">
      Scroll to see the current list of GitHub’s open issues with the label <strong>good first issue</strong>!
    </p>

    <section class="container d-flex flex-column align-items-center">
      <div id="issueDiv" class="row justify-content-center">
        <!-- Issues dynamically created here -->
      </div>
    </section>

    <div class="my-4">
      <button class="btn btn-primary px-4 py-2 fw-semibold" id="loadBtn">See More Results</button>
    </div>
  </main>

  <footer class="text-center py-3">
    <small class="text-muted">© 2025 First Issue Finder</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/index.js"></script>
</body>
</html>
